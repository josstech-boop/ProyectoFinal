<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Asistencias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <style>
    :root {
      --sidebar-width: 250px;
      --header-height: 60px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      background: #2c3e50;
      color: white;
    }

    .main-content {
      margin-left: var(--sidebar-width);
      padding: 20px;
    }

    .navbar {
      height: var(--header-height);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3498db;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar p-3">
    <div class="text-center mb-4">
      <h4>Sistema Escolar</h4>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white active" href="admin-users.html">
                    <i class="bi bi-people me-2"></i>Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="grados-admin.html">
                    <i class="bi bi-book me-2"></i>Grados
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="asignacion-alumnos.html">
                    <i class="bi bi-person-plus me-2"></i>Asignar Alumnos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="docente-asistencia.html">
                    <i class="bi bi-clipboard-data me-2"></i>Asistencia
                </a>
            </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-light bg-white">
      <div class="container-fluid">
        <div class="ms-auto d-flex align-items-center">
          <div class="user-avatar me-2" id="userAvatar">AD</div>
          <span class="fw-bold" id="username">Admin</span>
        </div>
      </div>
    </nav>

    <div class="container-fluid mt-4">
      <div class="card mb-4">
        <div class="card-header bg-white">
          <h5 class="mb-0">Registrar Asistencia</h5>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Alumno</label>
              <select id="alumnoSelect" class="form-select">
                <option value="">Cargando alumnos...</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Fecha</label>
              <input type="date" id="fechaInput" class="form-control" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Estado</label>
              <select id="estadoSelect" class="form-select">
                <option value="presente">presente</option>
                <option value="ausente">ausente</option>
                <option value="justificado">justificado</option>
              </select>
            </div>
          </div>
          <div class="text-end mt-3">
            <button id="btnGuardar" class="btn btn-primary"><i class="bi bi-save me-2"></i>Guardar</button>
          </div>
        </div>
      </div>

      <div class="card mb-4">
        <div class="card-header bg-white">
          <h5 class="mb-0">Filtrar Asistencias</h5>
        </div>
        <div class="card-body row g-3">
          <div class="col-md-4">
            <label class="form-label">Grado</label>
            <select id="filtroGrado" class="form-select">
              <option value="">Todos los grados</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Fecha</label>
            <input type="date" id="filtroFecha" class="form-control" />
          </div>
          <div class="col-md-4 d-grid">
            <button id="btnFiltrar" class="btn btn-secondary mt-4">Aplicar Filtros</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header bg-white">
          <h5 class="mb-0">Asistencias Registradas</h5>
        </div>
        <div class="card-body table-responsive">
          <table class="table table-bordered" id="tablaAsistencias">
            <thead>
              <tr>
                <th>Alumno</th>
                <th>Grado</th>
                <th>Fecha</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5" class="text-center">Cargando...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');

    document.addEventListener('DOMContentLoaded', () => {
      cargarAlumnos();
      cargarGrados();
      cargarAsistencias();

      document.getElementById('btnGuardar').addEventListener('click', guardarAsistencia);
      document.getElementById('btnFiltrar').addEventListener('click', cargarAsistencias);
    });

    async function cargarAlumnos() {
      try {
        const res = await fetch(`${API}/alumnos`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const alumnos = await res.json();
        const select = document.getElementById('alumnoSelect');
        select.innerHTML = '<option value="">Seleccione un alumno</option>';
        alumnos.forEach(a => {
          select.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
        });
      } catch (err) {
        alert('Error al cargar alumnos');
      }
    }

    async function cargarGrados() {
      try {
        const res = await fetch(`${API}/admin/grados`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const grados = await res.json();
        const filtro = document.getElementById('filtroGrado');
        filtro.innerHTML = '<option value="">Todos los grados</option>';
        grados.forEach(g => {
          filtro.innerHTML += `<option value="${g.id}">${g.nombre}</option>`;
        });
      } catch (err) {
        alert('Error al cargar grados');
      }
    }

    async function guardarAsistencia() {
      const alumnoId = document.getElementById('alumnoSelect').value;
      const fecha = document.getElementById('fechaInput').value;
      const estado = document.getElementById('estadoSelect').value;

      if (!alumnoId || !fecha || !estado) return alert("Todos los campos son obligatorios");

      try {
        const res = await fetch(`${API}/admin/asistencias`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ alumno_id: alumnoId, fecha, estado })
        });

        if (!res.ok) throw new Error('No se pudo guardar asistencia');
        alert('Asistencia registrada');
        cargarAsistencias();
      } catch (err) {
        alert('Error al guardar asistencia');
      }
    }

    async function cargarAsistencias() {
      const gradoId = document.getElementById('filtroGrado').value;
      const fecha = document.getElementById('filtroFecha').value;

      let url = `${API}/admin/asistencias`;
      const params = [];

      if (gradoId) params.push(`grado_id=${gradoId}`);
      if (fecha) params.push(`fecha=${fecha}`);
      if (params.length) url += '?' + params.join('&');

      try {
        const res = await fetch(url, {
          headers: { Authorization: `Bearer ${token}` }
        });

        const asistencias = await res.json();
        const tbody = document.querySelector('#tablaAsistencias tbody');
        tbody.innerHTML = '';

        if (asistencias.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center">Sin registros</td></tr>';
          return;
        }

        asistencias.forEach(a => {
          tbody.innerHTML += `
        <tr>
          <td>${a.alumno_nombre}</td>
          <td>${a.grado_nombre}</td>
          <td>${a.fecha}</td>
          <td>${a.estado}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="eliminarAsistencia(${a.id})">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>`;
        });
      } catch (err) {
        alert('Error al cargar asistencias');
      }
    }

    async function eliminarAsistencia(id) {
      if (!confirm('¿Eliminar esta asistencia?')) return;

      try {
        const res = await fetch(`${API}/admin/asistencias/${id}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) throw new Error();
        alert('Asistencia eliminada');
        cargarAsistencias();
      } catch (err) {
        alert('Error al eliminar asistencia');
      }
    }
  </script>

</body>

</html>
