<!DOCTYPE html>
<html>
<head>
  <title>Tomar Asistencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <h2>Tomar Asistencia</h2>
    <div class="mb-3">
      <label>Seleccione Grado:</label>
      <select class="form-select" id="gradoSelect"></select>
    </div>
    <div class="mb-3">
      <label>Fecha:</label>
      <input type="date" class="form-control" id="fechaInput">
    </div>
    <table class="table" id="asistenciaTable">
      <thead>
        <tr>
          <th>Alumno</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button class="btn btn-success" id="guardarBtn">Guardar Asistencia</button>
  </div>

  <script>
    // Código para cargar alumnos y guardar asistencia
    document.getElementById('guardarBtn').addEventListener('click', () => {
      const asistencias = [];
      document.querySelectorAll('#asistenciaTable tbody tr').forEach(row => {
        asistencias.push({
          alumnoId: row.dataset.id,
          estado: row.querySelector('select').value
        });
      });

      fetch('/api/asistencia', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        },
        body: JSON.stringify({
          gradoId: document.getElementById('gradoSelect').value,
          fecha: document.getElementById('fechaInput').value,
          asistencias
        })
      }).then(response => {
        if (response.ok) alert('Asistencia guardada!');
      });
    });
  </script>
</body>
</html>
