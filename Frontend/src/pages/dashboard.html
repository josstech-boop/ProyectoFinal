<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Asistencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --header-height: 60px;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            background: #2c3e50;
            color: white;
            transition: all 0.3s;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
        }
        
        .navbar {
            height: var(--header-height);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <div class="text-center mb-4">
            <h4>Sistema de Asistencias</h4>
        </div>
        <ul class="nav flex-column" id="sidebarMenu">
            <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white active" href="admin-users.html">
                    <i class="bi bi-people me-2"></i>Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="grados-admin.html">
                    <i class="bi bi-book me-2"></i>Grados
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="docente-asistencia.html">
                    <i class="bi bi-clipboard-data me-2"></i>Reportes
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand navbar-light bg-white">
            <div class="container-fluid">
                <div class="ms-auto d-flex align-items-center">
                    <div class="user-avatar me-2" id="userAvatar">AD</div>
                    <div>
                        <span class="fw-bold" id="username">Admin</span>
                        <div class="text-muted small" id="userRole">Administrador</div>
                    </div>
                    <button class="btn btn-link text-dark ms-3" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Dashboard Content -->
        <div class="container-fluid mt-4">
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Total Usuarios</h5>
                            <h2 class="mb-0" id="totalUsers">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">Docentes</h5>
                            <h2 class="mb-0" id="totalTeachers">0</h2>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-info text-white">
                        <div class="card-body">
                            <h5 class="card-title">Alumnos</h5>
                            <h2 class="mb-0" id="totalStudents">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Actividad Reciente</h5>
                    <a href="admin-users.html" class="btn btn-sm btn-primary">Ver Todos los Usuarios</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="recentActivityTable">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Correo</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Datos se cargarán con JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Variables globales
        let currentPage = 1;
        const itemsPerPage = 10;
        let allUsers = [];
        let filteredUsers = [];

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Decodificar token con manejo seguro
                const payload = JSON.parse(atob(token.split('.')[1]));
                console.log("Payload decodificado:", payload);

                // Manejo seguro de los datos del usuario
                const usernameElement = document.getElementById('username');
                const userRoleElement = document.getElementById('userRole');
                const userAvatarElement = document.getElementById('userAvatar');

                if (usernameElement) {
                    usernameElement.textContent = payload.nombre || 'Usuario';
                }

                if (userRoleElement) {
                    userRoleElement.textContent = payload.rol || 'Rol no definido';
                }

                if (userAvatarElement) {
                    const userName = payload.nombre || 'U';
                    userAvatarElement.textContent = userName.charAt(0).toUpperCase();
                }

                // Cargar usuarios
                await loadUsers();

            } catch (error) {
                console.error("Error al inicializar:", error);
                window.location.href = 'login.html';
            }

            // Event listeners
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('addUserBtn')?.addEventListener('click', showAddUserModal);
            document.getElementById('saveUserBtn')?.addEventListener('click', saveUser);
            document.getElementById('searchInput')?.addEventListener('input', filterUsers);
            document.getElementById('roleFilter')?.addEventListener('change', filterUsers);
            document.getElementById('resetFiltersBtn')?.addEventListener('click', resetFilters);
        });

        // Función para cargar usuarios desde la API
        async function loadUsers() {
            try {
                const token = localStorage.getItem('token');
                if (!token) throw new Error('No hay token disponible');

                const response = await fetch('http://localhost:5000/api/admin/usuarios', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log("Respuesta del servidor:", response);

                if (response.status === 401) { // Token inválido
                    logout();
                    return;
                }

                if (!response.ok) {
                    const error = await response.text();
                    throw new Error(error || "Error al cargar usuarios");
                }

                const users = await response.json();
                console.log("Usuarios recibidos:", users);

                allUsers = users;
                filteredUsers = [...users];
                renderUsers();
                renderPagination();

                // Actualizar contadores del dashboard
                document.getElementById('totalUsers').textContent = users.length;
                document.getElementById('totalTeachers').textContent = 
                    users.filter(u => u.rol === 'docente').length;
                document.getElementById('totalStudents').textContent = 
                    users.filter(u => u.rol === 'alumno').length;

            } catch (error) {
                console.error("Error en loadUsers():", error);
                alert("Error al cargar usuarios: " + error.message);
            }
        }

        // Función para renderizar usuarios en la tabla
        function renderUsers() {
            const tbody = document.querySelector('#recentActivityTable tbody');
            if (!tbody) return;

            tbody.innerHTML = '';

            const usersToShow = filteredUsers.slice(0, 5); // Mostrar solo 5 recientes

            if (usersToShow.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center">No se encontraron usuarios</td>
                    </tr>
                `;
                return;
            }

            usersToShow.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.nombre || 'Sin nombre'}</td>
                    <td>${user.correo || 'Sin correo'}</td>
                    <td>
                        <span class="badge bg-${user.rol === 'admin' ? 'danger' : 
                             user.rol === 'docente' ? 'primary' : 'success'}">
                            ${user.rol || 'Sin rol'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary">Ver</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // Función para guardar usuario (crear o actualizar)
        async function saveUser() {
            const btn = document.getElementById('saveUserBtn');
            if (!btn) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Guardando...';

            try {
                const userData = {
                    nombre: document.getElementById('name')?.value.trim(),
                    correo: document.getElementById('email')?.value.trim(),
                    password: document.getElementById('password')?.value,
                    rol: document.getElementById('role')?.value
                };

                // Validaciones
                if (!userData.nombre || !userData.correo || !userData.rol) {
                    throw new Error('Todos los campos son obligatorios');
                }

                const token = localStorage.getItem('token');
                if (!token) throw new Error('No hay sesión activa');

                const response = await fetch('http://localhost:5000/api/admin/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(userData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Error al guardar usuario');
                }

                // Cerrar modal y actualizar
                const modal = bootstrap.Modal.getInstance(document.getElementById('userModal'));
                if (modal) modal.hide();

                await loadUsers();
                alert('Usuario creado exitosamente!');

            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Guardar';
            }
        }

        // Función para cerrar sesión
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        // Otras funciones (filtros, paginación, etc.)
        function filterUsers() {
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            const roleFilter = document.getElementById('roleFilter')?.value;

            filteredUsers = allUsers.filter(user => {
                const matchesSearch = user.nombre?.toLowerCase().includes(searchTerm) || 
                                     user.correo?.toLowerCase().includes(searchTerm);
                const matchesRole = roleFilter ? user.rol === roleFilter : true;
                
                return matchesSearch && matchesRole;
            });

            currentPage = 1;
            renderUsers();
            renderPagination();
        }

        function resetFilters() {
            if (document.getElementById('searchInput')) document.getElementById('searchInput').value = '';
            if (document.getElementById('roleFilter')) document.getElementById('roleFilter').value = '';
            filteredUsers = [...allUsers];
            currentPage = 1;
            renderUsers();
            renderPagination();
        }

        // Funciones de paginación
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            if (!pagination) return;

            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage);
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // Botón Anterior
            pagination.innerHTML += `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Anterior</a>
                </li>
            `;

            // Números de página
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                    </li>
                `;
            }

            // Botón Siguiente
            pagination.innerHTML += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Siguiente</a>
                </li>
            `;
        }

        window.changePage = function(page) {
            currentPage = page;
            renderUsers();
            window.scrollTo(0, 0);
        };
    </script>
</body>
</html>
