<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --header-height: 60px;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            background: #2c3e50;
            color: white;
            transition: all 0.3s;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
        }
        
        .navbar {
            height: var(--header-height);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <div class="text-center mb-4">
            <h4>Sistema de Asistencias</h4>
        </div>
        <ul class="nav flex-column" id="sidebarMenu">
            <li class="nav-item">
            <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white active" href="admin-users.html">
                    <i class="bi bi-people me-2"></i>Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="grados-admin.html">
                    <i class="bi bi-book me-2"></i>Grados
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="asignacion-alumnos.html">
                    <i class="bi bi-person-plus me-2"></i>Asignar Alumnos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="docente-asistencia.html">
                    <i class="bi bi-clipboard-data me-2"></i>Asistencia
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar navbar-expand navbar-light bg-white">
            <div class="container-fluid">
                <div class="ms-auto d-flex align-items-center">
                    <div class="user-avatar me-2">AD</div>
                    <span class="fw-bold">Administrador</span>
                </div>
            </div>
        </nav>

        <!-- Contenido Principal -->
        <div class="container-fluid mt-4">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Asignar Alumno a Grado</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Seleccionar Alumno</label>
                            <select class="form-select" id="selectAlumno">
                                <option value="">Cargando alumnos...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Seleccionar Grado</label>
                            <select class="form-select" id="selectGrado">
                                <option value="">Cargando grados...</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-end">
                        <button id="btnAsignar" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Asignar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de asignaciones -->
            <div class="card mt-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Asignaciones Actuales</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="tablaAsignaciones">
                            <thead>
                                <tr>
                                    <th>Alumno</th>
                                    <th>Grado Asignado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="3" class="text-center">Cargando asignaciones...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let asignaciones = [];

  document.addEventListener('DOMContentLoaded', async () => {
    await cargarAlumnosDesdeAPI();
    await cargarGradosDesdeAPI();
    await cargarAsignacionesDesdeAPI();

    document.getElementById('btnAsignar').addEventListener('click', asignarAlumnoAGrado);
  });

  async function cargarAlumnosDesdeAPI() {
    try {
      const token = localStorage.getItem('token');
      const res = await fetch('http://localhost:5000/api/alumnos', {
        headers: { Authorization: `Bearer ${token}` }
      });


      if (!res.ok) throw new Error('No se pudieron cargar los alumnos');
      const usuarios = await res.json();

      const select = document.getElementById('selectAlumno');
      select.innerHTML = '<option value="">Seleccionar alumno</option>';
      usuarios.forEach(usuarios => {
        select.innerHTML += `<option value="${usuarios.id}">${usuarios.nombre}</option>`;
      });

    } catch (error) {
      console.error('Error al cargar alumnos:', error);
      alert('Error al cargar alumnos');
    }
  }

  async function cargarGradosDesdeAPI() {
    try {
      const token = localStorage.getItem('token');
      const res = await fetch('http://localhost:5000/api/admin/grados', {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok) throw new Error('No se pudieron cargar los grados');
      const grados = await res.json();

      const select = document.getElementById('selectGrado');
      select.innerHTML = '<option value="">Seleccionar grado</option>';
      grados.forEach(grado => {
        select.innerHTML += `<option value="${grado.id}">${grado.nombre}</option>`;
      });

    } catch (error) {
      console.error('Error al cargar grados:', error);
      alert('Error al cargar grados');
    }
  }

  async function cargarAsignacionesDesdeAPI() {
    try {
      const token = localStorage.getItem('token');
      const res = await fetch('http://localhost:5000/api/admin/asignaciones', {
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok) throw new Error('No se pudieron cargar las asignaciones');
      asignaciones = await res.json();
      actualizarTablaAsignaciones();

    } catch (error) {
      console.error('Error al cargar asignaciones:', error);
      alert('Error al cargar asignaciones');
    }
  }

  async function asignarAlumnoAGrado() {
    const alumnoId = document.getElementById('selectAlumno').value;
    const gradoId = document.getElementById('selectGrado').value;
    const token = localStorage.getItem('token');

    if (!alumnoId || !gradoId) {
      alert("Debe seleccionar un alumno y un grado");
      return;
    }

    try {
      const res = await fetch('http://localhost:5000/api/asignacion-grado', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify({ alumno_id: alumnoId, grado_id: gradoId })
      });

      if (!res.ok) throw new Error('No se pudo asignar el alumno');

      alert('Asignación guardada con éxito');
      await cargarAsignacionesDesdeAPI();

    } catch (error) {
      console.error('Error al asignar alumno:', error);
      alert('Error al asignar alumno');
    }
  }

  async function eliminarAsignacion(id) {
    const token = localStorage.getItem('token');

    try {
      const res = await fetch(`http://localhost:5000/api/admin/asignaciones/${id}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok) throw new Error('No se pudo eliminar la asignación');

      alert('Asignación eliminada');
      await cargarAsignacionesDesdeAPI();

    } catch (error) {
      console.error('Error al eliminar asignación:', error);
      alert('Error al eliminar asignación');
    }
  }

  function actualizarTablaAsignaciones() {
    const tbody = document.querySelector('#tablaAsignaciones tbody');
    tbody.innerHTML = '';

    if (asignaciones.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" class="text-center">No hay asignaciones registradas</td></tr>';
      return;
    }

    asignaciones.forEach(asig => {
      tbody.innerHTML += `
        <tr>
          <td>${asig.alumno_nombre} ${asig.alumno_apellido}</td>
          <td>${asig.grado_nombre}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="eliminarAsignacion(${asig.id})">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </td>
        </tr>
      `;
    });
  }
</script>

</body>
</html>
