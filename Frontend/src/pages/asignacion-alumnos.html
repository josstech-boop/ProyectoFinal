<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --sidebar-width: 250px;
            --header-height: 60px;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            background: #2c3e50;
            color: white;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
        }
        
        .navbar {
            height: var(--header-height);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        #loadingSpinner {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <div class="text-center mb-4">
            <h4>Sistema Escolar</h4>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="admin-users.html">
                    <i class="bi bi-people me-2"></i>Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="grados-admin.html">
                    <i class="bi bi-book me-2"></i>Grados
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white active" href="asignacion-alumnos.html">
                    <i class="bi bi-person-plus me-2"></i>Asignar Alumnos
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="docente-asistencia.html">
                    <i class="bi bi-clipboard-data me-2"></i>Reportes
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar navbar-expand navbar-light bg-white">
            <div class="container-fluid">
                <div class="ms-auto d-flex align-items-center">
                    <div class="user-avatar me-2" id="userAvatar">AD</div>
                    <div>
                        <span class="fw-bold" id="username">Admin</span>
                        <div class="text-muted small" id="userRole">Administrador</div>
                    </div>
                    <button class="btn btn-link text-dark ms-3" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Contenido Principal -->
        <div class="container-fluid mt-4">
            <div class="card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Asignar Alumno a Grado</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Seleccionar Alumno</label>
                            <select class="form-select" id="selectAlumno">
                                <option value="">Cargando alumnos...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Seleccionar Grado</label>
                            <select class="form-select" id="selectGrado">
                                <option value="">Cargando grados...</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-end">
                        <button id="btnAsignar" class="btn btn-primary">
                            <i class="bi bi-save me-2"></i>Asignar
                            <span id="loadingSpinner" class="spinner-border spinner-border-sm d-none"></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de asignaciones -->
            <div class="card mt-4">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Asignaciones Actuales</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table" id="tablaAsignaciones">
                            <thead>
                                <tr>
                                    <th>Alumno</th>
                                    <th>Grado Asignado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="3" class="text-center">Cargando asignaciones...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Variables globales
        let alumnos = [];
        let grados = [];
        let asignaciones = [];

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Decodificar token para obtener información del usuario
                const payload = JSON.parse(atob(token.split('.')[1]));
                
                // Mostrar información del usuario en el navbar
                document.getElementById('username').textContent = payload.nombre || 'Usuario';
                document.getElementById('userRole').textContent = payload.rol || 'Administrador';
                document.getElementById('userAvatar').textContent = payload.nombre?.charAt(0).toUpperCase() || 'A';

                // Cargar datos iniciales
                await cargarDatosIniciales();
                document.getElementById('btnAsignar').addEventListener('click', asignarAlumnoAGrado);
                document.getElementById('logoutBtn').addEventListener('click', logout);

            } catch (error) {
                console.error("Error al inicializar:", error);
                window.location.href = 'login.html';
            }
        });

        // Cargar datos iniciales desde la base de datos
        async function cargarDatosIniciales() {
            try {
                const token = localStorage.getItem('token');
                
                // Cargar alumnos (usuarios con rol 'alumno')
                const alumnosResponse = await fetch('http://localhost:5000/api/admin/usuarios?rol=alumno', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!alumnosResponse.ok) throw new Error('Error al cargar alumnos');
                alumnos = await alumnosResponse.json();
                
                // Cargar grados
                const gradosResponse = await fetch('http://localhost:5000/api/admin/grados', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!gradosResponse.ok) throw new Error('Error al cargar grados');
                grados = await gradosResponse.json();
                
                // Cargar asignaciones actuales (alumnos_grados)
                const asignacionesResponse = await fetch('http://localhost:5000/api/admin/alumnos-grados', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!asignacionesResponse.ok) throw new Error('Error al cargar asignaciones');
                asignaciones = await asignacionesResponse.json();
                
                // Llenar selects y tabla
                llenarSelectAlumnos();
                llenarSelectGrados();
                actualizarTablaAsignaciones();
                
            } catch (error) {
                console.error("Error al cargar datos:", error);
                alert("Error al cargar datos: " + error.message);
                
                // Mostrar mensaje de error en la tabla
                document.querySelector('#tablaAsignaciones tbody').innerHTML = `
                    <tr>
                        <td colspan="3" class="text-center text-danger">Error al cargar datos: ${error.message}</td>
                    </tr>
                `;
            }
        }

        // Llenar select de alumnos
        function llenarSelectAlumnos() {
            const select = document.getElementById('selectAlumno');
            select.innerHTML = '<option value="">Seleccionar alumno</option>';
            
            alumnos.forEach(alumno => {
                select.innerHTML += `<option value="${alumno.id}">${alumno.nombre}</option>`;
            });
        }

        // Llenar select de grados
        function llenarSelectGrados() {
            const select = document.getElementById('selectGrado');
            select.innerHTML = '<option value="">Seleccionar grado</option>';
            
            grados.forEach(grado => {
                select.innerHTML += `<option value="${grado.id}">${grado.nombre}</option>`;
            });
        }

        // Asignar alumno a grado
        async function asignarAlumnoAGrado() {
            const alumnoId = document.getElementById('selectAlumno').value;
            const gradoId = document.getElementById('selectGrado').value;
            
            if (!alumnoId || !gradoId) {
                alert("Debe seleccionar un alumno y un grado");
                return;
            }
            
            try {
                const token = localStorage.getItem('token');
                const btn = document.getElementById('btnAsignar');
                const spinner = document.getElementById('loadingSpinner');
                
                btn.disabled = true;
                spinner.classList.remove('d-none');
                
                // Llamada a la API para guardar la asignación
                const response = await fetch('http://localhost:5000/api/admin/alumnos-grados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        alumno_id: alumnoId, 
                        grado_id: gradoId 
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Error al asignar');
                }
                
                // Recargar las asignaciones después de guardar
                const asignacionesResponse = await fetch('http://localhost:5000/api/admin/alumnos-grados', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!asignacionesResponse.ok) throw new Error('Error al cargar asignaciones');
                asignaciones = await asignacionesResponse.json();
                
                actualizarTablaAsignaciones();
                alert("Asignación realizada con éxito");
                
            } catch (error) {
                console.error("Error al asignar:", error);
                alert("Error al realizar la asignación: " + error.message);
            } finally {
                const btn = document.getElementById('btnAsignar');
                const spinner = document.getElementById('loadingSpinner');
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        }

        // Actualizar tabla de asignaciones
        function actualizarTablaAsignaciones() {
            const tbody = document.querySelector('#tablaAsignaciones tbody');
            
            if (asignaciones.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center">No hay asignaciones registradas</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            asignaciones.forEach(asig => {
                tbody.innerHTML += `
                    <tr>
                        <td>${asig.alumno_nombre}</td>
                        <td>${asig.grado_nombre}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="eliminarAsignacion(${asig.alumno_id}, ${asig.grado_id})">
                                <i class="bi bi-trash"></i> Eliminar
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // Eliminar asignación (ajustado para tu estructura de clave compuesta)
        window.eliminarAsignacion = async function(alumnoId, gradoId) {
            if (confirm("¿Está seguro de eliminar esta asignación?")) {
                try {
                    const token = localStorage.getItem('token');
                    
                    // Llamada a la API para eliminar
                    const response = await fetch(`http://localhost:5000/api/admin/alumnos-grados`, {
                        method: 'DELETE',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            alumno_id: alumnoId,
                            grado_id: gradoId
                        })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || 'Error al eliminar');
                    }
                    
                    // Actualizar lista local
                    asignaciones = asignaciones.filter(a => !(a.alumno_id == alumnoId && a.grado_id == gradoId));
                    actualizarTablaAsignaciones();
                    alert("Asignación eliminada con éxito");
                    
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert("Error al eliminar asignación: " + error.message);
                }
            }
        };

        // Función para cerrar sesión
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
