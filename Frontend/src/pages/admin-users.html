<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* Mantener los mismos estilos que el dashboard */
        :root {
            --sidebar-width: 250px;
            --header-height: 60px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            background: #2c3e50;
            color: white;
            transition: all 0.3s;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 20px;
        }

        .navbar {
            height: var(--header-height);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .pagination .page-item.active .page-link {
            background-color: #2c3e50;
            border-color: #2c3e50;
        }

        .pagination .page-link {
            color: #2c3e50;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <div class="text-center mb-4">
            <h4>Sistema de Asistencias</h4>
        </div>
        <ul class="nav flex-column" id="sidebarMenu">
            <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html"><i
                        class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="admin-users.html"><i class="bi bi-people me-2"></i>Usuarios</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="admin-grados.html"><i class="bi bi-book me-2"></i>Grados</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="asignacion-alumno.html"><i
                        class="bi bi-person-plus me-2"></i>Asignar Alumnos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white active" href="asistencia.html"><i
                        class="bi bi-check2-square me-2"></i>Asistencia</a>
            </li>

        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Navbar (igual que en dashboard.html) -->
        <nav class="navbar navbar-expand navbar-light bg-white">
            <div class="container-fluid">
                <div class="ms-auto d-flex align-items-center">
                    <div class="user-avatar me-2" id="userAvatar">AD</div>
                    <div>
                        <span class="fw-bold" id="username">Admin</span>
                        <div class="text-muted small" id="userRole">Administrador</div>
                    </div>
                    <button class="btn btn-link text-dark ms-3" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- User Management Content -->
        <div class="container-fluid mt-4">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Gestión de Usuarios</h5>
                    <button class="btn btn-primary" id="addUserBtn">
                        <i class="bi bi-plus-lg"></i> Nuevo Usuario
                    </button>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <input type="text" class="form-control" id="searchInput" placeholder="Buscar usuarios...">
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" id="roleFilter">
                                <option value="">Todos los roles</option>
                                <option value="admin">Administrador</option>
                                <option value="docente">Docente</option>
                                <option value="alumno">Alumno</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button class="btn btn-outline-secondary w-100" id="resetFiltersBtn">
                                <i class="bi bi-arrow-counterclockwise"></i> Limpiar
                            </button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover" id="usersTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Correo</th>
                                    <th>Rol</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Datos se cargarán con JavaScript -->
                            </tbody>
                        </table>
                    </div>

                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center" id="pagination">
                            <!-- Paginación se generará con JavaScript -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar usuario -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Agregar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password">
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label">Rol</label>
                            <select class="form-select" id="role" required>
                                <option value="">Seleccionar rol</option>
                                <option value="admin">Administrador</option>
                                <option value="docente">Docente</option>
                                <option value="alumno">Alumno</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveUserBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('addUserBtn').addEventListener('click', () => {
            // Limpia el formulario y muestra el modal
            document.getElementById('userForm').reset();
            document.getElementById('modalTitle').textContent = 'Agregar Usuario';
            new bootstrap.Modal(document.getElementById('userModal')).show();
        });

        document.getElementById('saveUserBtn').addEventListener('click', async () => {
            const nombre = document.getElementById('name').value.trim();
            const correo = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rol = document.getElementById('role').value;

            if (!nombre || !correo || !rol || !password) {
                alert('Por favor, complete todos los campos.');
                return;
            }

            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    alert('Debe iniciar sesión para realizar esta acción.');
                    return;
                }

                const response = await fetch('http://localhost:5000/api/admin/usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nombre, correo, password, rol })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Usuario registrado con éxito');
                    // Aquí puedes cerrar el modal y actualizar la tabla de usuarios
                    bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                    document.getElementById('userForm').reset();
                    // Actualizar tabla (si tienes una función, por ejemplo: cargarUsuarios())
                } else {
                    alert('Error al registrar usuario: ' + result.error);
                }
            } catch (error) {
                console.error('Error al enviar solicitud:', error);
                alert('Ocurrió un error inesperado.');
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Variables globales
        let currentPage = 1;
        const itemsPerPage = 10;
        let allUsers = [];
        let filteredUsers = [];

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Decodificar token con manejo seguro
                const payload = JSON.parse(atob(token.split('.')[1]));
                console.log("Payload decodificado:", payload);

                // Manejo seguro de los datos del usuario
                const usernameElement = document.getElementById('username');
                const userRoleElement = document.getElementById('userRole');
                const userAvatarElement = document.getElementById('userAvatar');

                if (usernameElement) {
                    usernameElement.textContent = payload.nombre || 'Usuario';
                }

                if (userRoleElement) {
                    userRoleElement.textContent = payload.rol || 'Rol no definido';
                }

                if (userAvatarElement) {
                    const userName = payload.nombre || 'U';
                    userAvatarElement.textContent = userName.charAt(0).toUpperCase();
                }

                // Cargar usuarios
                await loadUsers();

            } catch (error) {
                console.error("Error al inicializar:", error);
                window.location.href = 'login.html';
                return;
            }

            // Event listeners
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('addUserBtn').addEventListener('click', showAddUserModal);
            document.getElementById('saveUserBtn').addEventListener('click', saveUser);
            document.getElementById('searchInput').addEventListener('input', filterUsers);
            document.getElementById('roleFilter').addEventListener('change', filterUsers);
            document.getElementById('resetFiltersBtn').addEventListener('click', resetFilters);
        });

        // Función para cargar usuarios
        async function loadUsers() {
            // Debug: Verificar token
            const token = localStorage.getItem('token');
            if (!token) {
                alert('No hay token almacenado. Redirigiendo a login...');
                window.location.href = 'login.html';
                return;
            }

            try {
                console.log("Enviando request con token:", token); // Debug
                const response = await fetch('http://localhost:5000/api/admin/usuarios', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                // Debug: Inspeccionar respuesta completa
                console.log("Response status:", response.status);
                const data = await response.json();
                console.log("Response data:", data);

                if (!response.ok) {
                    throw new Error(data.error || 'Error al cargar usuarios');
                }

                if (!Array.isArray(data)) {
                    throw new Error('Formato de respuesta inválido');
                }

                allUsers = data;
                filteredUsers = [...allUsers];
                renderUsers();
                renderPagination();

            } catch (error) {
                console.error("Error completo:", {
                    message: error.message,
                    stack: error.stack
                });
                alert(`Error: ${error.message}\nVer consola para detalles`);
            }
        }

        // Función para renderizar usuarios en la tabla
        function renderUsers() {
            const tbody = document.querySelector('#usersTable tbody');
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedUsers = filteredUsers.slice(startIndex, startIndex + itemsPerPage);

            if (paginatedUsers.length === 0) {
                tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center">No se encontraron usuarios</td>
                </tr>
            `;
                return;
            }

            paginatedUsers.forEach(user => {
                tbody.innerHTML += `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.nombre}</td>
                    <td>${user.correo}</td>
                    <td><span class="badge bg-${user.rol === 'admin' ? 'danger' : user.rol === 'docente' ? 'primary' : 'success'}">${user.rol}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="editUser(${user.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="confirmDelete(${user.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `;
            });
        }

        // Función para renderizar paginación
        function renderPagination() {
            const totalPages = Math.ceil(filteredUsers.length / itemsPerPage);
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            if (totalPages <= 1) return;

            // Botón Anterior
            pagination.innerHTML += `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">Anterior</a>
            </li>
        `;

            // Números de página
            for (let i = 1; i <= totalPages; i++) {
                pagination.innerHTML += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                </li>
            `;
            }

            // Botón Siguiente
            pagination.innerHTML += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">Siguiente</a>
            </li>
        `;
        }

        // Función para cambiar de página
        window.changePage = function (page) {
            currentPage = page;
            renderUsers();
            window.scrollTo(0, 0);
        };

        // Función para filtrar usuarios
        function filterUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;

            filteredUsers = allUsers.filter(user => {
                const matchesSearch = user.nombre.toLowerCase().includes(searchTerm) ||
                    user.correo.toLowerCase().includes(searchTerm);
                const matchesRole = roleFilter ? user.rol === roleFilter : true;

                return matchesSearch && matchesRole;
            });

            currentPage = 1;
            renderUsers();
            renderPagination();
        }

        // Función para resetear filtros
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('roleFilter').value = '';
            filteredUsers = [...allUsers];
            currentPage = 1;
            renderUsers();
            renderPagination();
        }

        // Función para mostrar modal de agregar usuario
        function showAddUserModal() {
            document.getElementById('modalTitle').textContent = 'Agregar Usuario';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('password').required = true;

            const modal = new bootstrap.Modal(document.getElementById('userModal'));
            modal.show();
        }

        // Función para editar usuario
        window.editUser = function (userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('modalTitle').textContent = 'Editar Usuario';
            document.getElementById('userId').value = user.id;
            document.getElementById('name').value = user.nombre;
            document.getElementById('email').value = user.correo;
            document.getElementById('role').value = user.rol;
            document.getElementById('password').required = false;

            const modal = new bootstrap.Modal(document.getElementById('userModal'));
            modal.show();
        };

        // Función para guardar usuario (crear o actualizar)
        async function saveUser() {
            const form = document.getElementById('userForm');
            const nombre = document.getElementById('name').value.trim();
            const correo = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rol = document.getElementById('role').value;
            const userId = document.getElementById('userId').value;

            // Validación mejorada
            if (!nombre || !correo || !rol) {
                alert('Por favor complete todos los campos obligatorios');
                return;
            }

            if (!userId && !password) {
                alert('Para nuevos usuarios, la contraseña es obligatoria');
                return;
            }

            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    window.location.href = 'login.html';
                    return;
                }

                const userData = { nombre, correo, rol };
                if (password) userData.password = password;

                const url = userId ? `http://localhost:5000/api/admin/usuarios/${userId}` : 'http://localhost:5000/api/admin/usuarios';
                const method = userId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(userData)
                });

                const result = await response.json();
                location.reload()
                if (!response.ok) {
                    throw new Error(result.message || 'Error en la operación');
                }
                location.reload()
                // Cierre y actualización
                bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
                await loadUsers(); // Espera a que se recarguen los usuarios
                location.reload()
                alert(`Usuario ${userId ? 'actualizado' : 'creado'} correctamente`);
                location.reload()
            } catch (error) {
                console.error('Error detallado:', error);
                //alert(`Error: ${error.message}`);
            }
        }

        // Función para confirmar eliminación
        window.confirmDelete = function (userId) {
            if (confirm('¿Está seguro que desea eliminar este usuario?')) {
                deleteUser(userId);
            }
        };

        // Función para eliminar usuario
        async function deleteUser(userId) {
            try {
                const response = await fetch(`http://localhost:5000/api/admin/usuarios/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Error al eliminar');
                }

                await loadUsers(); // Recargar la lista después de eliminar
                alert('Usuario eliminado correctamente');

            } catch (error) {
                console.error('Error al eliminar:', error);
                alert(`Error al eliminar usuario: ${error.message}`);
            }
        }

        // Función para cerrar sesión
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
