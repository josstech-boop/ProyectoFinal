<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Docentes y Grados</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
            background: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Docentes y Grados Asignados</h1>
    
    <div id="loading" class="loading">Cargando datos...</div>
    
    <table id="tabla-docentes" style="display: none;">
        <thead>
            <tr>
                <th>Docente</th>
                <th>Grados Asignados</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <!-- Los datos se insertarán aquí con JavaScript -->
        </tbody>
    </table>

    <script>
        // Función para cargar los datos
        async function cargarDocentesGrados() {
            try {
                const response = await fetch('/api/docente/todos', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                
                if (!response.ok) throw new Error('Error al cargar datos');
                
                const { data } = await response.json();
                const tabla = document.getElementById('tabla-docentes');
                const loading = document.getElementById('loading');
                
                // Ocultar loading y mostrar tabla
                loading.style.display = 'none';
                tabla.style.display = 'table';
                
                // Agrupar por docente
                const docentes = {};
                data.forEach(row => {
                    if (!docentes[row.docente_id]) {
                        docentes[row.docente_id] = {
                            id: row.docente_id,
                            nombre: row.docente_nombre,
                            grados: []
                        };
                    }
                    docentes[row.docente_id].grados.push({
                        id: row.grado_id,
                        nombre: row.grado_nombre
                    });
                });
                
                // Mostrar en tabla
                const tbody = tabla.querySelector('tbody');
                tbody.innerHTML = Object.values(docentes).map(docente => `
                    <tr>
                        <td>${docente.nombre}</td>
                        <td>${docente.grados.map(g => g.nombre).join(', ')}</td>
                        <td>
                            <button onclick="editarDocente(${docente.id})">Editar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                document.getElementById('loading').textContent = 'Error: ' + error.message;
                console.error(error);
            }
        }

        // Función para editar docente (ejemplo)
        function editarDocente(docenteId) {
            alert('Editar docente con ID: ' + docenteId);
            // Aquí podrías abrir un modal o redirigir a otra página
        }

        // Cargar los datos cuando la página esté lista
        document.addEventListener('DOMContentLoaded', () => {
            // Verificar si el usuario está logueado
            if (!localStorage.getItem('token')) {
                window.location.href = '/login.html';
                return;
            }
            
            cargarDocentesGrados();
        });
    </script>
</body>
</html>
